version: '3.8'

services:
  sisa-api:
    build: .
    container_name: sisa-api-container
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./logs:/app/logs
    restart: always

    grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus